name: Build and Push Odoo 17 Dev Container

on:
  push:
    paths:
      - '.devcontainer/URL.conf'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/entrypoint.sh'
      - '.devcontainer/odoo.conf'
      - '.devcontainer/wait-for-psql.py'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Download the exact .deb pointed to by URL.conf (must be an Odoo 17 URL)
      - name: Download odoo.deb package
        if: github.event_name != 'pull_request'
        run: |
          ODOO_URL=$(cat .devcontainer/URL.conf | tr -d '[:space:]')
          echo "Downloading Odoo .deb from: ${ODOO_URL}"
          curl -sSL -o .devcontainer/odoo.deb "${ODOO_URL}"

      # Read the actual version baked into the .deb and fail-fast if it is not 17.x
      - name: Verify Odoo version is 17.x and set env vars
        if: github.event_name != 'pull_request'
        run: |
          ODOO_DEB_VERSION=$(dpkg-deb -f .devcontainer/odoo.deb Version)
          echo "ODOO_DEB_VERSION=${ODOO_DEB_VERSION}" >> $GITHUB_ENV

          MAJOR=$(echo "${ODOO_DEB_VERSION}" | cut -d'.' -f1)
          if [ "${MAJOR}" != "17" ]; then
            echo "ERROR: URL.conf points to Odoo ${MAJOR}.x, but this branch is v17."
            echo "       Update URL.conf to use an Odoo 17 nightly URL."
            exit 1
          fi
          echo "Version check passed: ${ODOO_DEB_VERSION}"

          if echo "${ODOO_DEB_VERSION}" | grep -q 'e'; then
            echo "ODOO_TYPE=enterprise" >> $GITHUB_ENV
          else
            echo "ODOO_TYPE=community" >> $GITHUB_ENV
          fi

      - name: Determine if latest tag should be used
        if: github.event_name != 'pull_request'
        run: |
          if grep -q 'latest' .devcontainer/URL.conf; then
            echo "IS_LATEST=true" >> $GITHUB_ENV
          else
            echo "IS_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Extract Docker metadata
        if: ${{ github.event_name != 'pull_request' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/odoo-v17-${{ env.ODOO_TYPE }}
          tags: |
            type=raw,value=${{ env.ODOO_DEB_VERSION }}
            type=raw,value=latest,enable=${{ env.IS_LATEST }}

      - name: Build and push Docker image
        if: ${{ github.event_name != 'pull_request' }}
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./.devcontainer
          file: ./.devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
